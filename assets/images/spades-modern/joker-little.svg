<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 230" role="img" aria-labelledby="title desc">
  <title id="title">Little Joker</title>
  <desc id="desc">A refined silver harlequin-spade seal with teal ornament on a midnight playing card.</desc>
  <defs>
